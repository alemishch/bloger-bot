# Диалоговые фазы для «разбора ситуации» (TASK.md §4.2, §4.3, §4.7).
# Переход вперёд только после typical_duration_days_min календарных дней в фазе (UTC).
blogger_id: yuri
phases:
  - id: contact_mapping
    title: "Контакт и картография"
    typical_duration_days_min: 3
    focus: >
      Этап как примерно три первых визита к психологу: почти только сбор картины — что беспокоит, в каком контексте живёт человек,
      что уже пробовал, что повторялось во времени, что сейчас острее всего. Без развёрнутой «терапии» и без программы изменений.
    exit_signals: >
      По объёму и глубине данных это уже сопоставимо с ~3 полноценными сессиями: есть история, релевантный контекст (работа/семья/тело),
      что пробовали; можно смещаться к поиску повторяющихся сценариев. До этого момента остаёмся в вопросах и прояснении.
    prompt_injection: >
      Ты в ПЕРВОЙ фазе — режим «только узнать больше». Ответ пользователю в основном из уточняющих вопросов и короткого отражения
      (1–2 предложения что ты понял), без длинных выводов, без «вам нужно», без планов исправления, без списков техник и заданий.
      Не разворачивай гипотезы «как лечиться» и не подменяй сбор данных советами — это начнётся в следующих фазах после накопления контекста.

  - id: pattern_exploration
    title: "Повтор и паттерн"
    typical_duration_days_min: 3
    focus: >
      Сместить внимание с «что болит сегодня» на «что уже было похожего»: автоматизмы, сценарии, роли, телесные/жизненные повторы.
    exit_signals: >
      Виден хотя бы один устойчивый паттерн или повтор сценария; пользователь узнаёт формулировку или спорит с ней — оба сигнала ок.
    prompt_injection: >
      Этап исследования повтора. Связывай текущее с прошлым опытом пользователя. Избегай универсального коучинга и наборов техник.
      Один угол методологии Юрия, один следующий шаг мысли или наблюдения.

  - id: hypothesis_deepening
    title: "Гипотезы и методология"
    typical_duration_days_min: 3
    focus: >
      Сформулировать 1–3 содержательные гипотезы в логике автоматизмов vs программ, релевантных ролей эксперта, биологии как первичной опоры.
    exit_signals: >
      Есть зафиксированные гипотезы, пользователь отреагировал (согласие, сомнение, уточнение); можно переводить к маленьким шагам проверки в жизни.
    prompt_injection: >
      Этап гипотез. Явно различай автоматизмы и программы где уместно. Не смешивай все роли эксперта сразу.
      Опора на методологию и при необходимости на контент из базы — без длинного пересказа.

  - id: integration_steps
    title: "Интеграция и шаги"
    typical_duration_days_min: 3
    focus: >
      1–2 реалистичных шага: самонаблюдение, микро-эксперимент, разговор с врачом или граница — без перегруза.
    exit_signals: >
      Пользователь пробует шаги, возвращается с обратной связью; или тема естественно смещается — тогда остаёмся в поддержке шага.
    prompt_injection: >
      Этап интеграции. Мало, но выполнимо: один-два шага, понятные критерии «что заметить».
      Не начинай новый большой цикл разбора в одном сообщении.
